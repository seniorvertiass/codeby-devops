namespace: dev

nameOverride: ""
fullnameOverride: ""

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    port: 3306

  storage:
    size: 1Gi
    storageClass: local-storage
    accessMode: ReadWriteOnce
    hostPath: /data/mysql
    nodeName: minikube

  database:
    name: wordpress
    user: wordpress

wordpress:
  image:
    repository: wordpress
    tag: latest
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

  storage:
    size: 1Gi
    storageClass: local-storage
    accessMode: ReadWriteOnce
    hostPath: /data/wordpress
    nodeName: minikube-m02

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

ingress:
  enabled: true
  className: nginx

  host: wordpress.local

  path: /
  pathType: Prefix

networkPolicy:
  enabled: true

secret:
  mysqlRootPassword: rootpassword
  mysqlPassword: wordpresspassword

config:
  mysqlDatabase: wordpress
  mysqlUser: wordpress
